# =====================================================================
# INSSOFT PEOPLE — configuración base
# Los secretos SIEMPRE se proporcionan por variables de entorno.
# Para desarrollo local usar application-local.properties (ignorado por git).
# =====================================================================

server.port=${SERVER_PORT:8443}
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# -------------------------
# Base de datos (SQL Server)
# -------------------------
# Se aceptan DB_URL/DB_USERNAME/DB_PASSWORD o los alias BD_HOST/BD_USER/BD_PASS.
spring.datasource.url=${DB_URL:${BD_HOST:}}
spring.datasource.username=${DB_USERNAME:${BD_USER:}}
spring.datasource.password=${DB_PASSWORD:${BD_PASS:}}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000

# -------------------------
# JPA / Hibernate
# -------------------------
# Flyway es el único mecanismo que modifica el esquema.
# 'none' evita que Hibernate altere la base. Cambiar a 'validate' cuando
# la migración V1 (baseline real) esté verificada en el entorno.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# -------------------------
# Flyway
# -------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# -------------------------
# Thymeleaf (cliente legado)
# -------------------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# -------------------------
# Seguridad / JWT
# -------------------------
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:https://inssoft.mx}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# -------------------------
# Correo (legado; se desacoplará al módulo de notificaciones)
# -------------------------
app.mail.from=${MAIL_FROM:ci.admin@inssoftmx.com}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# -------------------------
# Aplicación
# -------------------------
app.system.url=${APP_SYSTEM_URL:http://localhost:8443/login}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# -------------------------
# OpenAPI / Actuator
# -------------------------
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# -------------------------
# Logging
# -------------------------
logging.level.root=INFO
logging.level.com.mx.vacaciones=INFO
logging.level.com.inssoft.people=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{requestId:-}] %logger{36} - %msg%n
logging.file.name=${LOG_FILE:logs/inssoft-people.log}
