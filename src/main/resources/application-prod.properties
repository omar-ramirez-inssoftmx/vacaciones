# =====================================================================
# Perfil producción — sin secretos, sin SQL logging, sin DDL automático.
# =====================================================================
server.port=${SERVER_PORT:8443}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:${BD_HOST:}}
spring.datasource.username=${DB_USERNAME:${BD_USER:}}
spring.datasource.password=${DB_PASSWORD:${BD_PASS:}}

# Fail-fast: el esquema debe coincidir con las migraciones Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.thymeleaf.cache=true

logging.level.root=INFO
logging.level.com.mx.vacaciones=INFO
logging.level.com.inssoft.people=INFO
logging.file.name=${LOG_FILE:logs/inssoft-people.log}

management.endpoints.web.exposure.include=health,info
