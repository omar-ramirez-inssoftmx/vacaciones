<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/people-head :: head('Mi equipo')}"></head>
<body class="people-page">
<nav th:replace="~{fragments/people-nav :: nav('team')}"></nav>

<main class="people-container" data-tour="team">
  <section class="people-hero">
    <div>
      <div class="people-hero__eyebrow">Liderazgo</div>
      <h1>Mi equipo</h1>
      <p>Colaboradores que reportan directamente contigo.</p>
    </div>
    <div class="people-hero__actions">
      <span class="people-badge" th:text="${#lists.size(equipo)} + ' colaborador(es)'"></span>
      <a class="btn btn-outline-secondary btn-sm no-loader" th:href="@{/leader/requests}">Ir a bandeja</a>
    </div>
  </section>

  <section class="people-card mt-4">
    <div class="people-card__header"><h2>Colaboradores directos</h2></div>

    <div class="people-card__body people-card__body--flush"
         th:if="${equipo != null and !#lists.isEmpty(equipo)}">
      <div class="people-table-wrap">
        <table class="people-table">
          <thead>
          <tr>
            <th>Colaborador</th>
            <th>Número</th>
            <th>Puesto</th>
            <th>Departamento</th>
            <th>Correo</th>
            <th>Estatus</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="e : ${equipo}">
            <td>
              <strong th:text="${e.fullName}"></strong>
              <div class="profile-contact__meta" th:text="${e.companyName}"></div>
            </td>
            <td th:text="${e.employeeNumber}"></td>
            <td th:text="${e.positionName}"></td>
            <td th:text="${e.departmentName}"></td>
            <td th:text="${e.corporateEmail ?: '-'}"></td>
            <td>
              <span class="people-badge"
                    th:classappend="${e.statusCode == 'ACTIVO'} ? ' people-badge--success' : ' people-badge--danger'"
                    th:text="${e.statusName}"></span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="people-empty" th:if="${equipo == null or #lists.isEmpty(equipo)}">
      <div class="people-empty__icon">👥</div>
      <div class="people-empty__title">Sin colaboradores directos</div>
      <div>Cuando tengas personas a tu cargo aparecerán aquí.</div>
    </div>
  </section>
</main>

<div id="globalLoader" class="global-loader" aria-hidden="true">
  <div class="global-loader__box">
    <div class="global-loader__spinner"></div>
    <div class="global-loader__title">Cargando<span class="global-loader__dots"></span></div>
  </div>
</div>
<link rel="stylesheet" href="/css/global-loader.css">
<script src="/js/bootstrap.bundle.min.js"></script>
<script src="/js/global-loader.js"></script>
</body>
</html>
